# Build the site and deploy it to the Khoury server.
#
# The site is generated by build.py, which uses only the Python standard
# library -- there is no toolchain to install and nothing to pin.

name: Build site and deploy on Khoury server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Fails loudly on malformed data (missing field, broken link, missing
      # image), so a bad commit stops here and never reaches the server.
      - name: Build
        run: python3 build.py

      - name: Remove old files
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: cd /proj/rplatt/helpinghands/.www ; ls | grep -v 'backup' | xargs -r rm -r

      - name: Transfer Files
        uses: appleboy/scp-action@v0.1.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          source: "public/*"
          target: "/proj/rplatt/helpinghands/.www"
          strip_components: 1

      - name: Generate group.html
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: cd /proj/rplatt/helpinghands/.www ; cp index.html group.html
